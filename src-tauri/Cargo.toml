[package]
name = "autorenprogramm"
version = "0.2.0"
description = "Lokal-first Autorenprogramm für komplexe Romanprojekte"
authors = ["OnekoSL"]
license-file = "../LICENSE.md"
homepage = "https://github.com/OnekoSL/Autorenprogramm"
repository = "https://github.com/OnekoSL/Autorenprogramm"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "autorenprogramm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1.23.2", features = ["v4"] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "0.6.6"

[dev-dependencies]
tempfile = "3.27.0"
